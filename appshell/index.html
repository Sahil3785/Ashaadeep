<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the CSS
         then pads it back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#18213c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Asha Deep Faculty</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318213c'/%3E%3Cpath d='M16 7 5 12l11 5 11-5-11-5Zm-7 9.5V21c0 1.7 3.1 3 7 3s7-1.3 7-3v-4.5l-7 3.2-7-3.2Z' fill='%23fbb420'/%3E%3C/svg%3E" />

    <!-- No webfont request: the two families are bundled into the CSS so the
         app renders correctly with no network, which matters on patchy rural
         connections. -->

    <style>
      /* Painted before React mounts so the launch is never a white flash. */
      html, body { margin: 0; background: #0d1223; }
    </style>
  </head>

  </body>
